name: Sync v0.2.0 visual assets

on:
  push:
    branches:
      - feature/cpu-throttling-exe-layout

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync tested HypeTek visuals
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HypeTek/HypeTek-Bookmarker/main/resources/app.ico" -OutFile "resources\app.ico"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HypeTek/HypeTek-Bookmarker/main/resources/default-wallpaper.jpg" -OutFile "resources\default-wallpaper.jpg"

          Add-Type -AssemblyName System.Drawing
          $ico = New-Object System.Drawing.Icon((Resolve-Path 'resources\app.ico'))
          $src = $ico.ToBitmap()
          $canvas = New-Object System.Drawing.Bitmap 512,512
          $g = [System.Drawing.Graphics]::FromImage($canvas)
          $g.Clear([System.Drawing.Color]::Black)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src,6,6,500,500)
          $canvas.Save((Join-Path (Resolve-Path resources) 'app-logo.jpg'), [System.Drawing.Imaging.ImageFormat]::Jpeg)
          $g.Dispose(); $canvas.Dispose(); $src.Dispose(); $ico.Dispose()

          git config user.name "HypeTek Build"
          git config user.email "actions@users.noreply.github.com"
          git add resources/app.ico resources/app-logo.jpg resources/default-wallpaper.jpg
          if (git diff --cached --quiet) {
            Write-Host "Visual assets already up to date."
            exit 0
          }
          git commit -m "v0.2.0: sync bundled visual assets"
          git push origin HEAD:feature/cpu-throttling-exe-layout
