name: Sync v0.2.0 visual assets

on:
  push:
    branches:
      - feature/cpu-throttling-exe-layout

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync HypeTek visuals
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HypeTek/HypeTek-Bookmarker/main/resources/app.ico" -OutFile "resources\app.ico"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HypeTek/HypeTek-Bookmarker/main/resources/default-wallpaper.jpg" -OutFile "resources\default-wallpaper.jpg"

          Add-Type -AssemblyName PresentationCore
          $iconPath = (Resolve-Path 'resources\app.ico').Path
          $uri = New-Object System.Uri($iconPath, [System.UriKind]::Absolute)
          $decoder = [System.Windows.Media.Imaging.BitmapDecoder]::Create(
            $uri,
            [System.Windows.Media.Imaging.BitmapCreateOptions]::PreservePixelFormat,
            [System.Windows.Media.Imaging.BitmapCacheOption]::OnLoad
          )
          $frame = $decoder.Frames | Sort-Object PixelWidth -Descending | Select-Object -First 1
          if (-not $frame) { throw 'Could not decode app.ico' }
          $encoder = New-Object System.Windows.Media.Imaging.JpegBitmapEncoder
          $encoder.QualityLevel = 92
          [void]$encoder.Frames.Add($frame)
          $stream = [System.IO.File]::Create((Join-Path (Resolve-Path resources) 'app-logo.jpg'))
          try { $encoder.Save($stream) } finally { $stream.Dispose() }

          git config user.name "HypeTek Build"
          git config user.email "actions@users.noreply.github.com"
          git add resources/app.ico resources/app-logo.jpg resources/default-wallpaper.jpg
          if (git diff --cached --quiet) {
            Write-Host "Visual assets already up to date."
            exit 0
          }
          git commit -m "v0.2.0: sync bundled visual assets"
          git push origin HEAD:feature/cpu-throttling-exe-layout
